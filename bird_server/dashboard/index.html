<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bird Localization</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial;background:#0b1220;color:#e5e7eb}.app{display:flex;min-height:100vh}.side{width:350px;background:#111827;padding:20px;overflow:auto;border-right:1px solid #334155}.brand{font-size:23px;font-weight:700}.sub{color:#94a3b8;font-size:13px;margin:6px 0 18px}.card{background:#172033;border:1px solid #263247;border-radius:12px;padding:14px;margin-bottom:12px}.label{font-size:11px;color:#94a3b8;font-weight:bold;letter-spacing:.08em}.value{margin-top:6px}.row{display:flex;gap:8px}.row>*{flex:1}input,button{padding:10px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:white;width:100%}button{cursor:pointer;background:#2563eb;border:0;font-weight:600}button.secondary{background:#334155}button.danger{background:#b91c1c}.phoneItem{display:flex;justify-content:space-between;padding:10px;background:#0f172a;border-radius:8px;margin-top:7px;font-size:13px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#64748b;margin-right:6px}.dot.on{background:#22c55e}.mapWrap{flex:1;padding:25px;overflow:auto}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.world{position:relative;width:1000px;height:1000px;border:2px solid #64748b;background:#0f172a;box-shadow:0 10px 40px #0006}.grid{position:absolute;background:#263247}.tick{position:absolute;color:#64748b;font-size:10px}.phone{position:absolute;width:68px;height:68px;border-radius:50%;background:#2563eb;border:3px solid #93c5fd;transform:translate(-50%,50%);display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px;font-weight:bold;cursor:grab;z-index:5;user-select:none}.phone.off{background:#475569;border-color:#94a3b8}.phone.sel{outline:3px solid #facc15}.bird{position:absolute;width:22px;height:22px;border-radius:50%;background:#ef4444;transform:translate(-50%,50%);z-index:8}.circle{position:absolute;border:2px dashed #f87171;border-radius:50%;transform:translate(-50%,50%);z-index:6;pointer-events:none}@media(max-width:850px){.app{flex-direction:column}.side{width:100%;border-right:0}.mapWrap{min-height:700px}}
</style></head><body><div class="app"><aside class="side"><div class="brand">Bird Localization</div><div class="sub">TDOA demonstration dashboard</div>
<div class="card"><div class="label">STATUS</div><div class="value" id="status">Loading…</div></div>
<div class="card"><div class="row"><div><div class="label">SPECIES</div><div class="value" id="species">—</div></div><div><div class="label">CONFIDENCE</div><div class="value" id="confidence">—</div></div></div></div>
<div class="card"><div class="label">BIRD LOCATION</div><div class="value" id="location">Waiting for audio</div><div class="label" style="margin-top:10px">ERROR BOUND</div><div class="value" id="errorBound">—</div></div>
<div class="card"><div class="label">ADD / REGISTER PHONE</div><input id="newId" placeholder="e.g. phone_1"><div class="row"><input id="newX" type="number" placeholder="X metres" value="0"><input id="newY" type="number" placeholder="Y metres" value="0"></div><button onclick="addPhone()">Add phone</button></div>
<div class="card"><div class="label">SELECTED PHONE</div><div id="selectedName" class="value">None</div><div class="row"><input id="sx" type="number" step=".01" placeholder="X"><input id="sy" type="number" step=".01" placeholder="Y"></div><button onclick="saveSelected()">Update coordinates</button><button class="danger" onclick="removeSelected()">Remove selected</button></div>
<div class="card"><div class="label">PHONES</div><div id="phoneList"></div></div></aside>
<main class="mapWrap"><div class="toolbar"><div><b>Coordinate map</b><div class="sub">1 square = 1 metre × 1 metre</div></div><div class="row" style="width:180px"><button class="secondary" onclick="zoom(-10)">− Zoom</button><button class="secondary" onclick="zoom(10)">+ Zoom</button></div></div><div id="world" class="world"></div></main></div>
<script>
const world=document.getElementById('world');let ppm=50,W=20,H=20,phones=[],selected=null,drag=null;
function draw(){world.style.width=W*ppm+'px';world.style.height=H*ppm+'px';world.querySelectorAll('.grid,.tick').forEach(x=>x.remove());for(let i=0;i<=W;i++){let e=document.createElement('div');e.className='grid';e.style.cssText=`left:${i*ppm}px;bottom:0;width:1px;height:100%`;world.append(e);let t=document.createElement('div');t.className='tick';t.textContent=i;t.style.cssText=`left:${i*ppm+2}px;bottom:2px`;world.append(t)}for(let i=0;i<=H;i++){let e=document.createElement('div');e.className='grid';e.style.cssText=`left:0;bottom:${i*ppm}px;width:100%;height:1px`;world.append(e);let t=document.createElement('div');t.className='tick';t.textContent=i;t.style.cssText=`left:2px;bottom:${i*ppm+2}px`;world.append(t)}render()}
function ensure(x,y){let c=0;while(x>=W){W+=10;c=1}while(y>=H){H+=10;c=1}if(c)draw()}
function p(id){return phones.find(x=>x.id===id)}
function render(){world.querySelectorAll('.phone').forEach(x=>x.remove());phones.forEach(d=>{ensure(d.x,d.y);let e=document.createElement('div');e.className='phone '+(!d.connected?'off ':'')+(selected===d.id?'sel':'');e.textContent=d.id;e.style.left=d.x*ppm+'px';e.style.bottom=d.y*ppm+'px';e.onpointerdown=q=>{selected=d.id;drag=d.id;e.setPointerCapture(q.pointerId);selectUI()};e.onpointermove=q=>{if(drag!==d.id)return;let r=world.getBoundingClientRect();d.x=Math.max(0,+((q.clientX-r.left)/ppm).toFixed(2));d.y=Math.max(0,+((r.bottom-q.clientY)/ppm).toFixed(2));ensure(d.x,d.y);render();selectUI()};e.onpointerup=()=>{if(drag===d.id){drag=null;put(d)}};world.append(e)});list()}
function list(){phoneList.innerHTML=phones.map(d=>`<div class="phoneItem"><span><i class="dot ${d.connected?'on':''}"></i>${d.id}</span><span>(${d.x}, ${d.y})</span></div>`).join('')||'No phones registered';}
function selectUI(){selectedName.textContent=selected||'None';let d=p(selected);if(d){sx.value=d.x;sy.value=d.y}}
async function addPhone(){let phone_id=newId.value.trim();if(!phone_id)return alert('Enter a phone ID');let x=Number(newX.value),y=Number(newY.value);let r=await fetch('/phones',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone_id,x,y})});if(!r.ok)return alert(await r.text());newId.value='';await refreshPhones()}
async function put(d){await fetch('/phones/'+encodeURIComponent(d.id)+'/position',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({x:d.x,y:d.y})})}
async function saveSelected(){let d=p(selected);if(!d)return alert('Select a phone');d.x=Number(sx.value);d.y=Number(sy.value);if(d.x<0||d.y<0)return alert('Coordinates must be non-negative');ensure(d.x,d.y);render();await put(d)}
async function removeSelected(){if(!selected)return;let r=await fetch('/phones/'+encodeURIComponent(selected),{method:'DELETE'});if(!r.ok)return alert((await r.json()).detail||'Cannot remove phone');selected=null;await refreshPhones()}
function zoom(n){ppm=Math.max(20,Math.min(100,ppm+n));draw()}
async function refreshPhones(){phones=await (await fetch('/phones')).json();phones.forEach(d=>ensure(d.x,d.y));render()}
async function refreshResult(){let r=await (await fetch('/result')).json();status.textContent=r.status;species.textContent=r.species;confidence.textContent=((r.confidence||0)*100).toFixed(1)+'%';location.textContent=r.position?`X = ${r.position[0].toFixed(2)} m, Y = ${r.position[1].toFixed(2)} m`:'Waiting';errorBound.textContent=r.error_radius?`± ${r.error_radius.toFixed(2)} m`:'—';if(r.position){let [x,y]=r.position,rad=r.error_radius||.5;ensure(x+rad,y+rad);let b=document.getElementById('bird')||Object.assign(document.createElement('div'),{id:'bird',className:'bird'});b.style.left=x*ppm+'px';b.style.bottom=y*ppm+'px';world.append(b);let c=document.getElementById('circle')||Object.assign(document.createElement('div'),{id:'circle',className:'circle'});let z=rad*2*ppm;c.style.left=x*ppm+'px';c.style.bottom=y*ppm+'px';c.style.width=z+'px';c.style.height=z+'px';world.append(c)}}
draw();refreshPhones();refreshResult();setInterval(refreshPhones,1000);setInterval(refreshResult,500);
</script></body></html>
